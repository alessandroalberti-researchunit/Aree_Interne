# Deploy del sito dashboard-aree-interne.netlify.app
#
# Il repo versionato pesa ~437 MB (DOCS, output, DATA), che non devono finire
# online: il build copia in _site solo i due file che compongono il sito.
#
# Struttura pubblicata:
#   /                            -> la dashboard (rewrite, URL invariato)
#   /dashboard-aree-interne.html -> la dashboard (stesso path di GitHub Pages)
#   /presentazione               -> la landing page

[build]
  publish = "_site"
  command = "mkdir -p _site && cp dashboard-aree-interne.html _site/ && cp index.html _site/presentazione.html"

# La root serve la dashboard, come il deploy manuale precedente.
# Per mostrare invece la landing, sostituire il "to" con /presentazione.
[[redirects]]
  from = "/"
  to = "/dashboard-aree-interne.html"
  status = 200
