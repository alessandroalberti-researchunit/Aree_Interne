<!-- @dsCard group="Slides" viewport="1280x720" name="Section divider" subtitle="Violet · large index numeral" -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body { margin:0; }
  .slide { position:relative; width:1280px; height:720px; overflow:hidden; background:var(--gradient-mono);
    font-family:var(--font-body); color:#ECECFF; }
  .slide::after { content:""; position:absolute; right:-120px; top:-120px; width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle, rgba(73,225,192,0.45) 0%, transparent 65%); }
  .inner { position:absolute; inset:0; padding:72px 80px; display:flex; flex-direction:column; justify-content:space-between; z-index:2; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .logo { background:#FDFDFF; border-radius:10px; padding:9px 13px; display:flex; } .logo img { height:24px; }
  .meta { font-family:var(--font-mono); font-size:13px; color:var(--blanche-300); }
  .num { font-family:var(--font-mono); font-size:30px; color:var(--aqua-300); }
  .kicker { font-size:14px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--aqua-300); }
  h1 { font-family:var(--font-display); font-weight:500; font-size:88px; line-height:0.98; letter-spacing:-0.02em; color:#FDFDFF; margin:20px 0 0; max-width:14ch; }
  .rule { width:64px; height:4px; background:var(--color-accent); border-radius:999px; margin-top:30px; }
</style>
</head>
<body>
<div class="slide" data-screen-label="Section">
  <div class="inner">
    <div class="top">
      <div class="logo"><img src="../assets/logo/logo-izilab.png" alt="IZILab"></div>
      <div class="num">02 / 05</div>
    </div>
    <div>
      <div class="kicker">Capitolo 02</div>
      <h1>Scenari per le smart cities</h1>
      <div class="rule"></div>
    </div>
    <div class="meta">IZILab · Sistema visivo</div>
  </div>
</div>
</body>
</html>
