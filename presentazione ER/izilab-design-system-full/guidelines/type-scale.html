<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display 1 → caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--bg-surface); font-family: var(--font-body); color: var(--text-body); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-subtle); }
  .r:last-child { border-bottom: 0; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 130px; flex: none; }
  .sm { font-size: 11px; color: var(--text-muted); width: 46px; flex: none; text-align: right; }
  .sp { font-family: var(--font-display); color: var(--text-heading); white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
  <div class="r"><span class="tok">--text-display-2</span><span class="sp" style="font-size:40px">Anticipare</span><span class="sm">56</span></div>
  <div class="r"><span class="tok">--text-h1</span><span class="sp" style="font-size:32px">Anticipare il futuro</span><span class="sm">44</span></div>
  <div class="r"><span class="tok">--text-h2</span><span class="sp" style="font-size:26px">Anticipare il futuro</span><span class="sm">32</span></div>
  <div class="r"><span class="tok">--text-h3</span><span class="sp" style="font-size:20px">Anticipare il futuro</span><span class="sm">24</span></div>
  <div class="r"><span class="tok">--text-base</span><span class="sp" style="font-family:var(--font-body);font-size:15px;color:var(--text-body)">Anticipare il futuro con metodo</span><span class="sm">16</span></div>
  <div class="r"><span class="tok">--text-xs · kicker</span><span class="sp izi-kicker" style="font-family:var(--font-body)">Cosa troverai</span><span class="sm">12</span></div>
</body>
</html>
