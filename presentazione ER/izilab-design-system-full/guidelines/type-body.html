<!-- @dsCard group="Type" viewport="700x210" name="Body · Instrument Sans" subtitle="Body, kicker, CTA, labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-surface); font-family: var(--font-body); color: var(--text-body); }
  .kick { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .lede { font-size: 17px; font-weight: 600; color: var(--text-heading); margin: 0 0 8px; }
  .p { font-size: 14px; line-height: 1.55; max-width: 60ch; margin: 0 0 8px; }
  .weights { display: flex; gap: 18px; font-size: 14px; }
  .weights span { color: var(--text-body); }
</style>
</head>
<body>
  <div class="kick">Body · Instrument Sans</div>
  <p class="lede">Laboratorio di ricerca e foresight.</p>
  <p class="p">Guidiamo aziende e istituzioni attraverso l'incertezza del futuro con un approccio solido e basato sui dati.</p>
  <div class="weights">
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">SemiBold 600</span>
    <span style="font-weight:700">Bold 700</span>
  </div>
</body>
</html>
