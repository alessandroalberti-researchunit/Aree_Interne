<!-- @dsCard group="Type" viewport="700x190" name="Data · Chivo Mono" subtitle="Numbers, %, dates, tables — always mono" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-surface); font-family: var(--font-body); color: var(--text-body); }
  .kick { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
  .stats { display: flex; gap: 36px; align-items: baseline; }
  .stat .n { font-family: var(--font-mono); font-size: 44px; font-weight: 500; color: var(--text-heading); letter-spacing: -0.01em; }
  .stat .n .u { color: var(--color-accent); }
  .stat .l { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="kick">Data · Chivo Mono</div>
  <div class="stats">
    <div class="stat"><div class="n">+247<span class="u">%</span></div><div class="l">crescita prevista</div></div>
    <div class="stat"><div class="n">2035</div><div class="l">orizzonte</div></div>
    <div class="stat"><div class="n">0.92</div><div class="l">indice</div></div>
  </div>
</body>
</html>
