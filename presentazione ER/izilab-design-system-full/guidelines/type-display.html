<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--bg-surface); font-family: var(--font-body); }
  .kick { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .big { font-family: var(--font-display); color: var(--text-heading); font-weight: 500; font-size: 58px; line-height: 1.0; letter-spacing: -0.02em; margin: 0 0 6px; }
  .alpha { font-family: var(--font-display); color: var(--text-body); font-size: 22px; letter-spacing: 0.02em; margin: 12px 0 0; }
  em { color: var(--color-accent); font-style: normal; }
</style>
</head>
<body>
  <div class="kick">Display · Cirka <em>(fallback Domine)</em></div>
  <h1 class="big">Il futuro si anticipa</h1>
  <div class="alpha">AaBbCcDdEe Gg Qq Rr &amp; 0123456789</div>
</body>
</html>
