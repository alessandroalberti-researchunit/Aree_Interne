<!-- @dsCard group="Type" viewport="700x230" name="Editorial unit" subtitle="Kicker → title → aqua rule → body → →" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--bg-page); font-family: var(--font-body); color: var(--text-body); }
  .kick { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-kicker); }
  .title { font-family: var(--font-display); font-weight: 500; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em; color: var(--text-heading); margin: 10px 0 0; }
  .rule { width: 40px; height: 3px; background: var(--color-accent); border-radius: 999px; margin: 14px 0; }
  .body { font-size: 14px; line-height: 1.55; max-width: 46ch; margin: 0; }
  .arrow { margin-top: 18px; font-size: 22px; color: var(--color-accent); }
</style>
</head>
<body>
  <div class="kick">1. Cosa troverai</div>
  <h2 class="title">Racconto futuristico</h2>
  <div class="rule"></div>
  <p class="body">Una raccolta di storie ambientate in dodici metropoli europee proiettate in un futuro possibile.</p>
  <div class="arrow">&rarr;</div>
</body>
</html>
