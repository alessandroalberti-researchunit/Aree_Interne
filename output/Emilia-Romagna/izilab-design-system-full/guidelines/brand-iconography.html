<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 16px; background: var(--bg-surface); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .ic { background: #FBFBFF; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; height: 120px; }
  .ic img { height: 96px; object-fit: contain; }
</style>
</head>
<body>
  <div class="grid">
    <div class="ic"><img src="../assets/icons/icon-seed.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-diamond-square.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-lens-arrow.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-stack-diamond.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-concentric.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-overlap-circle.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-sunburst.png" alt=""></div>
    <div class="ic"><img src="../assets/icons/icon-window.png" alt=""></div>
  </div>
</body>
</html>
