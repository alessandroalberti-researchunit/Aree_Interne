<!-- @dsCard group="Colors" viewport="700x250" name="Semantic · Dark & Light" subtitle="Surfaces and text per mode" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; font-family: var(--font-body); display: grid; grid-template-columns: 1fr 1fr; }
  .pane { padding: 18px 20px; }
  .pane.dark { background: var(--bg-page); }
  .label { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }
  .card { border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--border-default); background: var(--surface-card); margin-bottom: 10px; }
  .heading { font-family: var(--font-display); font-size: 18px; color: var(--text-heading); margin: 0 0 4px; }
  .body { font-size: 12px; color: var(--text-body); margin: 0 0 4px; }
  .muted { font-size: 11px; color: var(--text-muted); margin: 0; }
  .rule { width: 36px; height: 3px; background: var(--color-accent); border-radius: 999px; margin: 8px 0; }
  .dark .label { color: var(--text-muted); }
  .light .label { color: var(--text-muted); }
</style>
</head>
<body>
  <div class="pane dark">
    <div class="label">Dark mode</div>
    <div class="card">
      <h4 class="heading">Heading</h4><div class="rule"></div>
      <p class="body">Body text on surface.</p>
      <p class="muted">Muted / secondary line.</p>
    </div>
  </div>
  <div class="pane light light" data-theme="light" style="background:var(--bg-page)">
    <div class="label">Light mode</div>
    <div class="card">
      <h4 class="heading">Heading</h4><div class="rule"></div>
      <p class="body">Body text on surface.</p>
      <p class="muted">Muted / secondary line.</p>
    </div>
  </div>
</body>
</html>
